; FastCGI over a unix socket (volume shared with the nginx container)
listen = /var/run/sockets/php.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management — modest values are enough for local dev
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Send logs to stderr so they show up in `docker logs`
php_admin_value[log_errors] = On
php_admin_value[error_reporting] = E_ALL
catch_workers_output = yes
decorate_workers_output = no

; Comfortable limits for local development
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M